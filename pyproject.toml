[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drunc"
description = "A flexible run control infrastructure for a distributed DAQ system"
version = "0.19.0"
readme = "docs/README.md"
requires-python = ">=3.10"

dependencies = [
    "click",
    "click-shell",
    "protobuf",
    "types-protobuf",
    "grpcio",
    "grpcio-status",
    "grpcio-tools",
    "types-grpcio",
    "gunicorn",
    "kafka-python",
    "nest-asyncio",
    "rich",
    "requests",
    "Flask",
    "Flask-RESTful",
    "sh",
    "kubernetes",
    "pytz",
    "psutil",
    "paramiko"
]

[project.optional-dependencies]
prod = ["paramiko[gssapi]"]
dev = ["ruff", "pre-commit", "pytest", "pytest-cov", "grpcio-testing", "grpcio==1.75", "grpcio-tools==1.75", "grpcio-status==1.75"]
test = ["pytest", "pytest-cov", "grpcio-testing",]

[project.scripts]
fake_daq_application = "drunc.apps.__main_fake_daqapp_rest__:main"
drunc-controller = "drunc.apps.__main_controller__:main"
drunc-controller-shell = "drunc.apps.__main_controller_shell__:main"
drunc-process-manager = "drunc.apps.__main_pm__:main"
drunc-process-manager-shell = "drunc.apps.__main_pm_shell__:main"
drunc-session-manager = "drunc.apps.__main_session_manager__:main"
drunc-unified-shell = "drunc.apps.__main_unified_shell__:main"
drunc-fsm-tests = "drunc.tests.__main_fsm__:main"
application-registry-service = "drunc.apps.__main_app_connectivity_server__:main"
drunc-ssh-doctor = "drunc.apps.__main_ssh_doctor__:main"
drunc-setup-ssh-config = "drunc.apps.__main_ssh_configurator__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"drunc.data.process_manager" = ["*.json"]
"drunc.data.process_manager.schema" = ["*.json"]

[tool.pytest.ini_options]
markers = [
    "grpc: marks tests for gRPC isolation (run with --test-grpc)",
]
addopts = "-v --tb=short --cov=drunc --cov=src/drunc tests/"

[tool.coverage.run]
source = ["drunc"]
omit = ["tests/*"]

# * See https://docs.astral.sh/ruff/rules/ for details on Ruff's linting options
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # check for errors using PyFlakes
    "I",    # best practices for import calls
    "UP",   # suggestions for code modernization
    "RUF",  # build in Ruff warnings
    "R",    # refactoring suggestions
]
ignore = [
    "E501", # Don't enforce line lengths within a linting context
]
