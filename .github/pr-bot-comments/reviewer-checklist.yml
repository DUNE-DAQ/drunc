# Items reviewers must tick in the routing comment before the checklist status passes.
# IDs are stored in the comment, so renaming one resets its state on open PRs.
items:
  - id: rebased
    text: This branch has been rebased with develop prior to testing. (to be enforced)
  - id: manual-tests
    text: Suggested manual tests show changes.
  - id: ci-failures
    text: CI workflow failures documented (if present).
  - id: local-integs
    text: run `scripts/run_daqsystemtest_integration_tests_not_in_ci.sh` as necessary
  - id: integration-test-report
    text: If the full integration test bundle was run, a PR comment states the host and optionally the test summary.

# Optional freeform markdown rendered below the checklist in the routing comment.
footer: |
  This checklist **must** be ticked off for the actions workflow to pass. When everything is checked, post `/checklist-complete` in a new comment on this pull request to rerun the reviewer-checklist check.

