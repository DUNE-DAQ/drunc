name: Setup Kind and Kubectl
description: Installs kubectl, kind, and spins up a cluster connected to the CI container

inputs:
  cluster_name:
    description: "The name of the kind cluster to create"
    required: true
    default: "test-cluster"

runs:
  using: composite
  steps:
    - name: Install and configure Kind cluster
      shell: bash
      run: |
        CLUSTER_NAME="${{ inputs.cluster_name }}"
        
        # Install kubectl
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/

        # Install kind
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
        chmod +x ./kind
        mv ./kind /usr/local/bin/

        # Create a fresh cluster using the dynamic input name
        kind create cluster --name $CLUSTER_NAME

        # Bridge the CI container to the kind network
        docker network connect kind $HOSTNAME
        
        # Get the internal IP and update kubeconfig
        KIND_IP=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' ${CLUSTER_NAME}-control-plane)
        kubectl config set-cluster kind-${CLUSTER_NAME} --server=https://${KIND_IP}:6443

        # Verify
        kubectl cluster-info
        kubectl get nodes