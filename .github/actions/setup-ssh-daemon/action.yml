name: Setup SSH daemon
description: Install OpenSSH, configure localhost key auth, and start sshd

runs:
  using: composite
  steps:
    - name: Install SSH and run the daemon
      shell: bash
      run: |
        dnf install -y openssh-server openssh-clients procps-ng jq
        ssh-keygen -A
        mkdir -p /root/.ssh
        # ed25519 is faster, shorter, and compliant with EL9 crypto policies
        ssh-keygen -t ed25519 -N "" -f /root/.ssh/id_ed25519
        cat /root/.ssh/id_ed25519.pub >> /root/.ssh/authorized_keys
        chmod 600 /root/.ssh/authorized_keys
        chmod 600 /root/.ssh/id_ed25519

        cat > /root/.ssh/config << 'EOF'
        Host localhost
            HostName 127.0.0.1
            User root
            IdentityFile /root/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
        EOF

        /usr/sbin/sshd
        ssh localhost echo "SSH is working"