name: Add pull request to DRUNC Internal project
# For new PRs, this workflow
# - Adds them to the DRUNC Internal project board 
# - Sets their Status and Sprint
# - Assigns the PR author. 
# The DUNE-DAQ tracking project is handled separately by the centrally managed track_new_prs.yml.

on:
  pull_request:
    types:
      - opened

# Remove the default GITHUB_TOKEN permissions
permissions: {}

jobs:
  track_prs_drunc_internal:
    name: Add new pull request to DRUNC Internal project
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the scripts
      pull-requests: write # Assign the PR author
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-scripts

      # Add the pull request to the DRUNC Internal project and sets its fields
      - name: Add PR to DRUNC Internal and set its fields
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_CI_ISSUES }} # Bot token with org project access
        run: python .github/scripts/track_new_pr_drunc_internal.py

      # Assign the PR author to the pull request
      - name: Assign PR author
        if: ${{ !cancelled() }} # Still assign the author if the DRUNC Internal step failed
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.actor]
            })
