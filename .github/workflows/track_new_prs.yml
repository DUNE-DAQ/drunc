name: Add pull request to project
on:
  pull_request:
    types:
      - opened

jobs:
  track_prs_dispatch:
    name: Add new pull request to project
    uses: DUNE-DAQ/.github/.github/workflows/track_new_prs.yml@develop
    secrets:
      BOT_CI_ISSUES: ${{ secrets.BOT_CI_ISSUES }}

  track_prs_drunc_project:
    runs-on: ubuntu-latest
    steps:
      - name: Add PR to drunc project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/DUNE-DAQ/projects/8
          github-token: ${{ secrets.BOT_CI_ISSUES }}