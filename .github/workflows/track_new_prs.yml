name: Add pull request to project
on:
  pull_request:
    types:
      - opened

jobs:
  track_prs_dispatch:
    name: Add new pull request to project
    uses: DUNE-DAQ/.github/.github/workflows/track_new_prs.yml@develop
    secrets:
      BOT_CI_ISSUES: ${{ secrets.BOT_CI_ISSUES }}

  track_prs_drunc_project:
    runs-on: ubuntu-latest
  
    permissions:
      pull-requests: write 
    steps:
      - name: Add PR to drunc project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/DUNE-DAQ/projects/8
          github-token: ${{ secrets.BOT_CI_ISSUES }}

      - name: Assign PR author
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.actor]
            })
