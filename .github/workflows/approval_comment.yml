name: Post approval comment

'on':
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

# Serialise per PR so simultaneous approvals cannot both post.
concurrency:
  group: approval-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-scripts

      - name: Post approval comment once per PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/post_approval_comment.py
