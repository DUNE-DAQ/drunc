name: Retry reviewer checklist

'on':
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: write

concurrency:
  group: retry-checklist-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  retry-checklist:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      contains(github.event.comment.body, '/retry-checklist')
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge retry command
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='+1' \
            --silent
      
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-scripts

      - name: Retry the PR's reviewer-checklist job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/retry_checklist.py