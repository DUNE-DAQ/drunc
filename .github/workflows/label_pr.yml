name: Label pull requests

'on':
  pull_request:
    types: [opened, reopened, synchronize, converted_to_draft, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/labeler@v6
        if: contains(fromJSON('["opened","reopened","synchronize","ready_for_review"]'), github.event.action)
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

      - uses: actions/setup-python@v5
        if: contains(fromJSON('["opened","reopened","synchronize","converted_to_draft","ready_for_review"]'), github.event.action)
        with:
          python-version: "3.11"

      - name: Install routing dependency
        if: contains(fromJSON('["opened","reopened","synchronize","converted_to_draft","ready_for_review"]'), github.event.action)
        run: python -m pip install PyYAML==6.0.2

      - name: Preview or route reviewers
        if: contains(fromJSON('["opened","reopened","synchronize","converted_to_draft","ready_for_review"]'), github.event.action)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: python .github/scripts/reviewer_routing.py

  reviewer-checklist:
    name: reviewer-checklist
    needs: label
    if: ${{ needs.label.result == 'success' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install routing dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Validate reviewer checklist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_STATUS: "false"
        run: python .github/scripts/check_reviewer_checklist.py