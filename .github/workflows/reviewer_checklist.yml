name: Validate reviewer checklist

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        type: number

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: reviewer-checklist-${{ github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install routing dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Validate reviewer checklist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_STATUS: "true"
        run: python .github/scripts/check_reviewer_checklist.py