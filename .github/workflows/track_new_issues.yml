name: Add issue to project
on:
  issues:
    types:
      - opened   
      
jobs:
  track_issues_dispatch:
    name: Add new issue to DUNE DAQ project
    uses: DUNE-DAQ/.github/.github/workflows/track_new_issues.yml@develop
    secrets:
      BOT_CI_ISSUES: ${{ secrets.BOT_CI_ISSUES }}

  track_issues_drunc_project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to drunc project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/DUNE-DAQ/projects/8
          github-token: ${{ secrets.BOT_CI_ISSUES }}