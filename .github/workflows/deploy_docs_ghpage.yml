name: Deploy Docs and Wiki to Pages 
on:
  workflow_dispatch: # enable manual triger. Only works in 'develop' branch 
  workflow_call:
  schedule:
    - cron: "0 0 * * 6" # midnight every Saturday
  gollum:

jobs: 
  docs: 
    timeout-minutes: 15 
    runs-on: ubuntu-latest 
    env: 
      WIKI_SUBFOLDER: Developer-Wiki
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ts-graphviz/setup-graphviz@v1
      - name: Checkout Main Repository
        uses: actions/checkout@v5

      # Clone the Wiki content  
      - name: Checkout Wiki Content 
        uses: actions/checkout@v5 
        with: 
          repository: ${{ github.repository }}.wiki 
          ref: master # Wiki default branch 
          # Create temporary wiki subfolder
          path: docs/${{ env.WIKI_SUBFOLDER }}

      - name: Install daqpytools for uml generation
        run : |
          pip install "daqpytools[dev] @ git+https://github.com/DUNE-DAQ/daqpytools.git@develop"

      # Move Archives to a temp folder so they aren't processed
      - name: Hide Archive files from script
        run: |
          mkdir -p /tmp/wiki_archives
          find docs/${{ env.WIKI_SUBFOLDER }} -name "Archive:*" -exec mv {} /tmp/wiki_archives/ \;

      # Copy images from main docs to the wiki folder
      - name: Stage Images for Wiki
        run: |
          cp docs/*.png docs/${{ env.WIKI_SUBFOLDER }}/ || true

      - name: Convert WikiLinks to Markdown Links
        env:
          GITHUB_PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python docs/utils/process_wiki.py $GITHUB_PAGES_BASE $WIKI_SUBFOLDER
          cd ~

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install .

      - name: run uml generation
        run: |
          daqpytools-generate-uml drunc --directory . --output-directory pics --split \
            --color-by-directory --generate-linkable --link-line-number
          mkdir docs/class_diagrams
          mv pics/split/classes_styled/*.png docs/class_diagrams
          mv pics/classes_styled.png docs/class_diagrams

          # Structured diagrams for the interactive Graph pages (docs/graph/).
          mkdir -p docs/class_diagrams/overall
          cp pics/classes_styled.svg pics/packages_styled.svg docs/class_diagrams/overall
          cp pics/directory_color_legend.svg docs/class_diagrams/overall || true

          package=drunc
          for directory in "src/$package"/*/; do
            [ -f "$directory/__init__.py" ] || continue
            name=$(basename "$directory")
            daqpytools-generate-uml "$package.$name" --directory . \
              --output-directory "pics/$name" \
              --color-by-directory --generate-linkable --link-line-number
            mkdir -p "docs/class_diagrams/src/$name"
            cp "pics/$name/classes_styled.svg" "pics/$name/packages_styled.svg" \
              "docs/class_diagrams/src/$name"
            cp "pics/$name/directory_color_legend.svg" "docs/class_diagrams/src/$name" || true
          done
          

      - name: Deploy Docs
        run: mkdocs gh-deploy --force

      # Check whether the links used in the documentation are valid
      # twiki, indico, amd dunescience excludes are used as they are behind SSOs, leading to timeouts, and errors being thrown by this step
      # drunc contains a set of outdated documentation page that should be kept for reference, they contain good descriptions on e.g. configuration structure
      # docs/graph/src is generated in-memory by docs/utils/generate_graph_src_pages.py (mkdocs-gen-files) during `mkdocs gh-deploy`,
      # so it never exists as a real file in the checked-out repo that lychee scans
      - name: Run Lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --exclude-path '(^|/)docs/graph/README\.md$'
            --exclude 'https://twiki.cern.ch/.*' 
            --exclude 'https://indico.*' 
            --exclude 'https://wiki.dunescience.org/wiki/.*'
            --exclude 'https://github.com/DUNE-DAQ/drunc/wiki/Archive:.*'
            docs/