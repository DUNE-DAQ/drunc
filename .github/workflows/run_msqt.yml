name: Run MSQT

on:
  pull_request:

jobs:
  install_and_test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      - name: Setup Temp Directory
        run: |
          TEST_DIR="$RUNNER_TEMP/my_integration_test"
          mkdir -p "$TEST_DIR"
          echo "TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"
          
          # Check the output is valid
          echo "Test output" > "$TEST_DIR/output.txt"
          echo "Checking tempdir contents"
          cat "$TEST_DIR/output.txt"

      - name: Check URLs
        env:
          REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          echo "https://github.com/${REPO_OWNER}/druncschema.git"
          echo "https://github.com/${REPO_OWNER}/drunc.git"

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup SSH daemon
        uses: ./.github/actions/setup-ssh-daemon

      - name: Set up dev nightly
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-dev-nightly

      - name: Install druncschema and drunc
        if: success()
        env:
          REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          cd nightly/NFD_DEV* || true
          source env.sh
          python -m pip install --upgrade pip
          
          cd sourcecode
          git clone "https://github.com/${REPO_OWNER}/druncschema.git" -b "$HEAD_REF" || git clone https://github.com/DUNE-DAQ/druncschema.git
          
          cd ../pythoncode
          git clone "https://github.com/${REPO_OWNER}/drunc.git" -b "$HEAD_REF" || git clone https://github.com/DUNE-DAQ/drunc.git

          # Go back to the nightly/NFD_DEV* root folder before building
          cd .. 
          dbt-build
          dbt-workarea-env
          
          echo "Current directory after building: $(pwd)"
          echo "DRUNC_DIR=$(pwd)" >> "$GITHUB_ENV"

      - name: Test with MSQT
        if: success()
        run: |
          cd nightly/NFD_DEV* || true
          source env.sh
          export USER=$(whoami)
          echo "Running test as user: $USER"
          
          daqsystemtest_integtest_bundle.sh --stop-on-failure --pytest-options "--skip-resource-checks --tb=long" -k small_footprint_quick_test.py --verbosity 5 --tmpdir "$TEST_DIR" 2>&1

      - name: Print test log
        if: always()
        run: |
          # Ensure it looks in TEST_DIR instead of hardcoded /tmp if that's where logs go
          log=$(find "$TEST_DIR" /tmp -name "dunedaq_integtest_bundle_*.log" 2>/dev/null | sort | tail -1)
          if [[ -n "$log" ]]; then
            echo "=== Test log: $log ==="
            cat "$log"
          else
            echo "No integtest bundle log file found."
          fi

      - name: Direct pytest on failure (for diagnostics)
        if: always()
        run: |
          cd nightly/NFD_DEV* || true
          source env.sh
          export USER=$(whoami)
          assets-list --subsystem readout
          
          LOCAL_TEST_SCRIPT="$TEST_DIR/small_footprint_quick_test.py"
          
          # CRITICAL FIX: Use -L to copy the actual file contents, not the Spack symlink
          cp -L "${DAQSYSTEMTEST_SHARE}/integtest/small_footprint_quick_test.py" "$LOCAL_TEST_SCRIPT"
          
          # Regex replacement: safely overrides the asset checksum with the physical file
          sed -i -E 's|asset://\?checksum=[a-f0-9]+|file:///cvmfs/dunedaq.opensciencegrid.org/assets/files/3/7/0/wib_link_67.bin|g' "$LOCAL_TEST_SCRIPT"
          
          echo "=== Direct pytest run on PATCHED script ==="
          python -m pytest -s -v --tb=long \
            --basetemp="$TEST_DIR/direct_pytest" \
            --skip-resource-checks \
            "$LOCAL_TEST_SCRIPT" || true