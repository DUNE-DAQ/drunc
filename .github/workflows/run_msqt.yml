name: Run MSQT

on:
  pull_request:

jobs:
  install_and_test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      - name: Setup Temp Directory
        run: |
          TEST_DIR="$RUNNER_TEMP/my_integration_test"
          mkdir -p "$TEST_DIR"
          echo "TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"
          
          # Check the output is valid
          echo "Test output" > "$TEST_DIR/output.txt"
          echo "Checking tempdir contents"
          cat "$TEST_DIR/output.txt"

      - name: Check URLs
        env:
          REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          echo "https://github.com/${REPO_OWNER}/druncschema.git"
          echo "https://github.com/${REPO_OWNER}/drunc.git"

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup SSH daemon
        uses: ./.github/actions/setup-ssh-daemon

      - name: Set up dev nightly
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-dev-nightly

      - name: Install druncschema and drunc
        if: success()
        env:
          REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          cd nightly/NFD_DEV* || true
          source env.sh
          python -m pip install --upgrade pip
          
          cd sourcecode
          git clone "https://github.com/${REPO_OWNER}/druncschema.git" -b "$HEAD_REF" || git clone https://github.com/DUNE-DAQ/druncschema.git
          
          cd ../pythoncode
          git clone "https://github.com/${REPO_OWNER}/drunc.git" -b "$HEAD_REF" || git clone https://github.com/DUNE-DAQ/drunc.git

          # Go back to the nightly/NFD_DEV* root folder before building
          cd .. 
          dbt-build
          dbt-workarea-env
          
          echo "Current directory after building: $(pwd)"
          echo "DRUNC_DIR=$(pwd)" >> "$GITHUB_ENV"

      - name: Test with MSQT
        if: success()
        run: |
          cd nightly/NFD_DEV* || true
          source env.sh
          export USER=$(whoami)
          echo "Running test as user: $USER"
          
          daqsystemtest_integtest_bundle.sh --stop-on-failure --pytest-options "--skip-resource-checks --tb=long" -k small_footprint_quick_test.py --verbosity 5 --tmpdir "$TEST_DIR" 2>&1

      - name: Print test log
        if: always()
        run: |
          # Ensure it looks in TEST_DIR instead of hardcoded /tmp if that's where logs go
          log=$(find "$TEST_DIR" /tmp -name "dunedaq_integtest_bundle_*.log" 2>/dev/null | sort | tail -1)
          if [[ -n "$log" ]]; then
            echo "=== Test log: $log ==="
            cat "$log"
          else
            echo "No integtest bundle log file found."
          fi

      - name: Direct pytest on failure (for diagnostics)
        if: always()
        run: |
          cd nightly/NFD_DEV* || true
          source env.sh
          export USER=$(whoami)
          
          echo "=== Copying test script for dynamic patching ==="
          LOCAL_TEST_SCRIPT="$TEST_DIR/small_footprint_quick_test.py"
          cp "${DAQSYSTEMTEST_SHARE}/integtest/small_footprint_quick_test.py" "$LOCAL_TEST_SCRIPT"
          
          echo "=== Generating Dynamic Asset Resolver ==="
          # Use a heredoc to safely write the Python script without YAML quoting issues
          cat << 'EOF' > resolve_assets.py
          import sqlite3, re, sys
          
          script_path = sys.argv[1]
          with open(script_path, 'r') as f:
              content = f.read()
              
          # Find all requested checksums dynamically
          checksums = set(re.findall(r'asset://\?checksum=([a-f0-9]+)', content))
          
          if checksums:
              print(f"Found required assets in test script: {checksums}")
              db_path = '/cvmfs/dunedaq.opensciencegrid.org/assets/dunedaq-asset-db.sqlite'
              conn = sqlite3.connect(db_path)
              conn.row_factory = sqlite3.Row
              c = conn.cursor()
              
              # Retrieve all table names to avoid hardcoded schema mismatch bugs
              c.execute("SELECT name FROM sqlite_master WHERE type='table';")
              tables = [row['name'] for row in c.fetchall()]
              
              for checksum in checksums:
                  file_path = None
                  for table in tables:
                      try:
                          c.execute(f"SELECT * FROM {table} WHERE checksum=?", (checksum,))
                          row = c.fetchone()
                          if row:
                              keys = row.keys()
                              # Robustly extract path and filename regardless of exact column names
                              subpath = row['path'] if 'path' in keys else row['subpath'] if 'subpath' in keys else None
                              name = row['name'] if 'name' in keys else row['filename'] if 'filename' in keys else row['file_name'] if 'file_name' in keys else None
                              
                              if subpath and name:
                                  file_path = f"/cvmfs/dunedaq.opensciencegrid.org/assets/{subpath}/{name}"
                                  break
                      except Exception:
                          continue
                          
                  if file_path:
                      print(f"Success: Resolved {checksum} -> {file_path}")
                      content = content.replace(f"asset://?checksum={checksum}", f"file://{file_path}")
                  else:
                      print(f"WARNING: Checksum {checksum} not found in any CVMFS DB table.")
                      
              # Overwrite the script with the newly resolved file:// URIs
              with open(script_path, 'w') as f:
                  f.write(content)
          else:
              print("No asset checksums found. Proceeding without patching.")
          EOF
          
          echo "=== Executing Dynamic Asset Resolver ==="
          python resolve_assets.py "$LOCAL_TEST_SCRIPT"
          
          echo "=== Direct pytest run ==="
          python -m pytest -s -v --tb=long \
            --basetemp="$TEST_DIR/direct_pytest" \
            --skip-resource-checks \
            "$LOCAL_TEST_SCRIPT" || true