name: Run MSQT

on:
  pull_request:

jobs:
  install_and_test:

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      - name: Check URLs
        run: |
          echo https://github.com/${{ github.event.pull_request.head.repo.owner.login }}/druncschema.git
          echo https://github.com/${{ github.event.pull_request.head.repo.owner.login }}/drunc.git

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup SSH daemon
        uses: ./.github/actions/setup-ssh-daemon

      - name: Set up dev nightly
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-dev-nightly

      - name: Install druncschema and drunc
        if: success()
        run: |
          cd nightly/NFD_DEV* || true
          source env.sh
          cd sourcecode
          echo "Checking part of the git clone resolution path: ${{ github.event.pull_request.head.repo.owner.login }}"
          git clone https://github.com/${{ github.event.pull_request.head.repo.owner.login }}/druncschema.git -b ${{ github.head_ref }} || git clone https://github.com/DUNE-DAQ/druncschema.git
          cd druncschema
          pip install .[test]
          cd ../../pythoncode
          git clone https://github.com/${{ github.event.pull_request.head.repo.owner.login }}/drunc.git -b ${{ github.head_ref }} || git clone https://github.com/DUNE-DAQ/drunc.git
          cd drunc
          pip install .[test]
          echo "DRUNC_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Test with MSQT
        if: success()
        run: |
          cd nightly/NFD_DEV* || true
          source env.sh
          echo "Check the permissions of the path used for testing"
          ls -lahrt .
          echo "Run the tests as the current user: $(whoami)"
          echo "Test command: dunedaq_integtest_bundle.sh --stop-on-failure --pytest-options "--skip-resource-checks" -k small_footprint_quick_test.py --verbosity 5 --tmpdir . 2>&1"
          dunedaq_integtest_bundle.sh --stop-on-failure --pytest-options "--skip-resource-checks" -k small_footprint_quick_test.py --verbosity 5 --tmpdir . 2>&1
          echo "ECHOING THE INTEGRATION TEST BUNDLE LOG FILE"
          cat pytest-of-*/dunedaq_integtest_bundle*.log

      - name: Print test log
        if: always()
        run: |
          log=$(find /tmp -name "dunedaq_integtest_bundle_*.log" 2>/dev/null | sort | tail -1)
          if [[ -n "$log" ]]; then
            echo "=== Test log: $log ==="
            cat "$log"
          else
            echo "No integtest bundle log file found under /tmp"
          fi

      - name: Direct pytest on failure (for diagnostics)
        if: failure()
        run: |
          cd nightly/NFD_DEV* || true
          source env.sh
          echo "=== Relevant environment ==="
          env | grep -E 'DAQSYSTEMTEST|DRUNC|DBT|DUNEDAQ|PYTHONPATH|PATH|USER' | sort
          echo "=== Direct pytest run ==="
          python -m pytest -s -v --tb=long \
            "${DAQSYSTEMTEST_SHARE}/integtest/small_footprint_quick_test.py" 2>&1 || true