name: Run MSQT FAST

on:
  pull_request:

jobs:
  install_and_test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      - name: Setup Temp Directory
        run: |
          TEST_DIR="$RUNNER_TEMP/my_integration_test"
          mkdir -p "$TEST_DIR"
          echo "TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"
          
          # Check the output is valid
          echo "Test output" > "$TEST_DIR/output.txt"
          echo "Checking tempdir contents"
          cat "$TEST_DIR/output.txt"
          ls /cvmfs/
          # Fix the schema mismatch: daq-assettools expects a table/view named 'files', 
          # but the database uses 'dunedaq_assets'. Create a view to bridge them.
      - name: Fully Hydrate CVMFS Asset Cache
        run: |
          echo "Forcing complete download of all asset files and database blocks..."
          # Recursively read every file in the assets directory to populate the local CVMFS block cache
          find /cvmfs/dunedaq.opensciencegrid.org/assets -type f -exec cat {} > /dev/null \;
          echo "Asset cache fully hydrated."
      - name: Check URLs
        env:
          REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          echo "https://github.com/${REPO_OWNER}/druncschema.git"
          echo "https://github.com/${REPO_OWNER}/drunc.git"

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup SSH daemon
        uses: ./.github/actions/setup-ssh-daemon

      - name: Debug CVMFS Asset Database Divergence
        if: always()
        run: |
          mkdir nightly || true
          cd nightly
          source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
          setup_dbt latest
          dbt-setup-release -n last_fddaq
          
          DB_PATH="/cvmfs/dunedaq.opensciencegrid.org/assets/dunedaq-asset-db.sqlite"
          
          echo "=== 1. CVMFS Repository Revision ==="
          # Determines if the CI runner is looking at the same filesystem snapshot as np04
          attr -qg revision /cvmfs/dunedaq.opensciencegrid.org 2>/dev/null || echo "attr command unavailable"
          cat /cvmfs/dunedaq.opensciencegrid.org/.cvmfs_status 2>/dev/null || echo ".cvmfs_status unavailable"
          
          echo "=== 2. Database File Checksum & Metadata ==="
          # Run 'md5sum /cvmfs/.../dunedaq-asset-db.sqlite' on np04 and compare it to this output
          md5sum "$DB_PATH"
          ls -l --time-style=full-iso "$DB_PATH"
          
          echo "=== 3. Inspect Schema and Total Rows ==="
          # Confirms the table exists and shows how many total assets the CI database knows about
          sqlite3 "$DB_PATH" ".tables"
          sqlite3 "$DB_PATH" "SELECT COUNT(*) FROM dunedaq_assets;"
          
          echo "=== 4. Check for Any Matching Substring ==="
          # Verifies if the checksum exists but has whitespace or hidden characters in CI
          sqlite3 "$DB_PATH" "SELECT * FROM dunedaq_assets WHERE checksum LIKE '%370df564205290d27cab47e44ae4ca47%';"
          
          echo "=== 5. Sample Valid WIBEth Assets in CI ==="
          # Prints the first 5 WIBEth checksums that the CI database ACTUALLY contains
          sqlite3 "$DB_PATH" "SELECT checksum FROM dunedaq_assets WHERE subsystem='readout' AND label='WIBEth' AND status='valid' LIMIT 5;"
          
          daqsystemtest_integtest_bundle.sh --stop-on-failure --pytest-options "--skip-resource-checks --tb=long" -k small_footprint_quick_test.py --verbosity 5 --tmpdir "$TEST_DIR" 2>&1