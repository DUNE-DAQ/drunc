name: Run MSQT FAST

on:
  pull_request:

jobs:
  install_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Mount the LIVE network CVMFS on the Ubuntu host
      - name: Mount CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@72f2a8d366043978d6aebee154bc9ed321c2f2a8
        with:
          cvmfs_repositories: 'dunedaq.opensciencegrid.org,dunedaq-development.opensciencegrid.org'

      # 2. Pull the container (the software is fresh, but its internal CVMFS is from 2023)
      - name: Pull container image
        run: docker pull ghcr.io/dune-daq/nightly-release-alma9:development_v5

      # 4. Check the base path and its creation date
      - name: Check Base Path and Creation Date
        run: |
          echo "=== Check the base path and its creation date ==="
          echo "Check root"
          ls -l --time-style=full-iso /
          echo "Check /cvmfs"
          ls -l --time-style=full-iso /cvmfs/

      # 3. Create a wrapper script to run inside the container
      - name: Run Integration Tests
        run: |
          cat << 'EOF' > run_test.sh
          #!/bin/bash
          echo "=== Configuring SSH for drunc Process Manager ==="

          # 1. Generate system host keys required by the SSH daemon
          ssh-keygen -A

          # 2. Start the SSH daemon in the background
          /usr/sbin/sshd

          # 3. Generate a local SSH keypair for the test user (with no passphrase)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""

          # 4. Authorize the local key for passwordless login
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          # 5. Add localhost and the container's dynamic hostname to known_hosts
          # This prevents the interactive "Are you sure you want to continue connecting?" prompt
          ssh-keyscan -H localhost 127.0.0.1 $(hostname) >> ~/.ssh/known_hosts

          echo "=== SSH Configuration Complete ==="
          echo "=== Check the base path and its creation date INSIDE THE CONTAINER ==="
          echo "Check root"
          ls -l --time-style=full-iso /
          echo "Check /cvmfs"
          ls -l --time-style=full-iso /cvmfs/
          echo "=== End of Base Path Check ==="
          set -eo pipefail
          
          mkdir -p nightly
          cd nightly
          
          # Because of the bind mount, this now accesses the LIVE Alma9 CVMFS environment
          source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
          setup_dbt latest
          dbt-setup-release -n last_fddaq
          
          # Let's prove the database is now up to date
          DB_PATH="/cvmfs/dunedaq.opensciencegrid.org/assets/dunedaq-asset-db.sqlite"
          echo "=== PROOF OF LIVE DATABASE ==="
          ls -l --time-style=full-iso "$DB_PATH"
          sqlite3 "$DB_PATH" "SELECT COUNT(*) FROM dunedaq_assets;"
          
          echo "=== Executing Tests ==="
          daqsystemtest_integtest_bundle.sh --stop-on-failure --pytest-options "--skip-resource-checks --tb=long" -k small_footprint_quick_test.py --verbosity 5
          EOF
          
          chmod +x run_test.sh
          
          # 4. Launch Docker and INJECT the live CVMFS over the dead snapshot
          docker run --rm \
            -v /cvmfs:/cvmfs:shared \
            -v "${GITHUB_WORKSPACE}:/ghw" \
            -w /ghw \
            ghcr.io/dune-daq/nightly-release-alma9:development_v5 \
            /ghw/run_test.sh