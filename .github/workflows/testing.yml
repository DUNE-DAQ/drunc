name: Run Tests

on:
  push:
    branches:
      - develop
      - 'prep-release/**'
  pull_request:
    branches:
      - develop
      - 'prep-release/**'
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Define globals used across multiple jobs
env:
  REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
  HEAD_REF: ${{ github.head_ref || github.ref_name }}

jobs:
  setup:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup SSH daemon
        uses: ./.github/actions/setup-ssh-daemon

      - name: Set up dev nightly
        uses: ./.github/actions/setup-dev-nightly

      - name: Install drunc and druncschema
        run: |
          cd nightly/NFD_DEV*
          source env.sh
          python -m pip install --upgrade pip
          
          cd sourcecode
          git clone "https://github.com/${REPO_OWNER}/druncschema.git" -b "$HEAD_REF" || git clone https://github.com/DUNE-DAQ/druncschema.git
          cd druncschema
          pip install .[test]
          
          cd ../../pythoncode
          git clone "https://github.com/${REPO_OWNER}/drunc.git" -b "$HEAD_REF" || git clone https://github.com/DUNE-DAQ/drunc.git
          cd drunc
          pip install .[test]

          cd ../..
          dbt-build --skip-python-install
          dbt-workarea-env

      - name: Install zstd
        run: dnf install -y zstd

      - name: Pack workarea
        run: tar --zstd -cf /tmp/nightly.tar.zst nightly

      - name: Upload environment artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-env
          path: /tmp/nightly.tar.zst
          compression-level: 0 # Fast transfer, already compressed
          retention-days: 1

  unit-tests:
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5
    permissions:
      checks: write # Required for action-junit-report

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly-env

      - name: Install zstd
        run: dnf install -y zstd
          
      - name: Unpack workarea
        run: tar --zstd -xf nightly.tar.zst

      - name: Run unit tests
        run: |
          cd nightly/NFD_DEV*
          source env.sh
          cd pythoncode/drunc
          pytest --junitxml=junit/test-results.xml --cov=drunc --cov-report=html

      - name: Publish JUnit test report
        uses: mikepenz/action-junit-report@v5
        if: ${{ !cancelled() }}
        with:
          check_name: "Pytest Results"
          report_paths: 'nightly/NFD_DEV*/pythoncode/drunc/junit/test-results.xml'
      
      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          name: html-coverage-report
          path: nightly/NFD_DEV*/pythoncode/drunc/htmlcov/
          retention-days: 1


  daqsystemtest-integration:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Prevents cancelling all tests if one fails
      matrix:
        test_script: 
          - small_footprint_quick_test.py
          - fake_data_producer_test.py
          - minimal_system_quick_test.py
    
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup SSH daemon
        uses: ./.github/actions/setup-ssh-daemon

      - uses: actions/download-artifact@v4
        with:
          name: nightly-env

      - name: Install zstd
        run: dnf install -y zstd
          
      - name: Unpack workarea
        run: tar --zstd -xf nightly.tar.zst

      - name: Setup Temp Directory
        run: |
          TEST_DIR="$RUNNER_TEMP/my_integration_test"
          mkdir -p "$TEST_DIR"
          echo "TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"

      - name: Run daqsystemtest (${{ matrix.test_script }})
        run: |
          cd nightly/NFD_DEV*
          source env.sh
          export USER=$(whoami)
          daqsystemtest_integtest_bundle.sh -k ${{ matrix.test_script }} --verbosity 5 --tmpdir "$TEST_DIR" 2>&1


  drunc-integration:
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nightly-env

      - name: Install zstd
        run: dnf install -y zstd
          
      - name: Unpack workarea
        run: tar --zstd -xf nightly.tar.zst

      - name: Run drunc integration tests
        run: |
          cd nightly/NFD_DEV*
          source env.sh
          cd pythoncode/drunc
          source scripts/setup_drunc_config_path.sh
          source scripts/drunc_integtest_bundle.sh --verbosity 5


  publish-coverage:
    # Depends only on unit-tests so it triggers without waiting for integration tests
    needs: unit-tests
    # always() ensures it runs even if unit tests failed, but only for pushes
    if: always() && github.event_name == 'push' && !contains(needs.unit-tests.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows actions-gh-pages to push HTML to gh-pages branch
      
    steps:
      - name: Download HTML coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov
          
      - name: Deploy HTML coverage to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: htmlcov
          destination_dir: coverage/${{ github.ref_name }}
          publish_branch: gh-pages
          keep_files: true
