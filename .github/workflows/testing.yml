name: Run Tests

on:
  pull_request:
  # Run on any pushes to the main branch which releases are generated from
  # push:
  #   branches:
  #     - develop
  #     - 'prep-release/**'

  # pull_request:
  #   branches:
  #     - develop
  #     - 'prep-release/**'
  #   # If taking a PR out of draft mode, run the workflow on the PR event as well
  #   types: [opened, synchronize, reopened, ready_for_review]

# Cancel any running jobs for this same branch if a new commit is pushed
concurrency:
  # Uses head_ref for PRs, and ref for pushes
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    # if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      - name: Setup Temp Directory
        run: |
          TEST_DIR="$RUNNER_TEMP/my_integration_test"
          mkdir -p "$TEST_DIR"
          echo "TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"

      - name: Check URLs
        env:
          # Fallback ensures this doesn't break on 'push' events where PR payload is null
          REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
        run: |
          echo "https://github.com/${REPO_OWNER}/druncschema.git"
          echo "https://github.com/${REPO_OWNER}/drunc.git"

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup SSH daemon
        uses: ./.github/actions/setup-ssh-daemon

      - name: Set up dev nightly
        uses: ./.github/actions/setup-dev-nightly

      - name: Install drunc and druncschema
        if: success()
        env:
          REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          cd nightly/NFD_DEV*
          source env.sh
          python -m pip install --upgrade pip
          
          cd sourcecode
          git clone "https://github.com/${REPO_OWNER}/druncschema.git" -b "$HEAD_REF" || git clone https://github.com/DUNE-DAQ/druncschema.git
          cd druncschema
          pip install -e .[test]
          
          cd ../../pythoncode
          git clone "https://github.com/${REPO_OWNER}/drunc.git" -b "$HEAD_REF" || git clone https://github.com/DUNE-DAQ/drunc.git
          cd drunc
          pip install -e .[test]

          # Go back to the nightly/NFD_DEV* root folder before building
          cd ../..
          dbt-build --skip-python-install
          dbt-workarea-env
          
          echo "Current directory after building: $(pwd)"
          echo "DRUNC_DIR=$(pwd)" >> "$GITHUB_ENV"
          
      - name: Run unit tests
        run: |
          cd nightly/NFD_DEV*
          source env.sh
          cd pythoncode/drunc
          # pytest --junitxml=junit/test-results.xml --cov=drunc --cov-report=html
          pytest

      - name: Run integration test
        run: |
          cd nightly/NFD_DEV*
          source env.sh
          export USER=$(whoami)
          echo "Running test as user: $USER"
          daqsystemtest_integtest_bundle.sh --pytest-options "--skip-resource-checks --tb=long" -k small_footprint_quick_test.py --verbosity 5 --tmpdir "$TEST_DIR" 2>&1

      - name: Run drunc integration tests
        run: |
          cd nightly/NFD_DEV*
          source env.sh
          cd pythoncode/drunc
          source scripts/setup_drunc_config_path.sh
          source scripts/drunc_integtest_bundle.sh --verbosity 5
          

      # - name: Publish JUnit test report
      #   uses: mikepenz/action-junit-report@v5
      #   with:
      #     report_paths: '${{ env.DRUNC_DIR }}/junit/test-results.xml'

      # - name: Deploy HTML coverage to GitHub Pages
