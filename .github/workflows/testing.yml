name: Run Tests

on:
  push:
    branches:
      - develop
      - 'prep-release/**'
  pull_request:
    branches:
      - develop
      - 'prep-release/**'
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Define globals used across multiple jobs
env:
  REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
  HEAD_REF: ${{ github.head_ref || github.ref_name }}

jobs:
  generate-release-tarball:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7

      - name: Set up dev nightly
        uses: ./.github/actions/setup-dev-nightly-with-drunc

      - name: Install zstd
        run: dnf install -y zstd

      - name: Pack workarea
        run: tar --zstd -cf /tmp/nightly.tar.zst nightly

      - name: Upload environment artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-env
          path: /tmp/nightly.tar.zst
          compression-level: 0
          retention-days: 1

