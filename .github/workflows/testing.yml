  daqsystemtest-integration-k8s:
    needs: [generate-release-tarball, select-daqsystemtest-integtests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        test_script: ${{ fromJSON(needs.select-daqsystemtest-integtests.outputs.matrix) }}
    
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7

      - name: Initialize Test Environment
        uses: ./.github/actions/setup-test-runner

      - name: Setup Kind and Kubectl
        uses: ./.github/actions/setup-kind
        with:
          cluster_name: daq-k8s-cluster

      - name: Run daqsystemtest (k8s)
        run: |
          # Stop Kubernetes from shadow-mounting over the container's baked-in CVMFS
          find nightly -type f -name "k8s.json" -exec sed -i 's|"mount_path": "/cvmfs"|"mount_path": "/tmp/dummy_cvmfs"|g' {} +

          cd nightly/NFD_DEV*
          source env.sh
          export USER=$(whoami)

          daqsystemtest_integtest_bundle.sh \
            -k "${{ matrix.test_script }}" \
            --pytest-options "--process-manager-type k8s" \
            --verbosity 5 \
            --tmpdir "$TEST_DIR" 2>&1 | tee "$TEST_DIR/bundle_stdout.log"

      - name: Validate test pass
        if: always()
        uses: ./.github/actions/validate-test-pass

      - name: Inspect Kubernetes Pod State & Failure
        if: failure()
        run: |
          KIND_NODE=$(docker ps --filter "label=io.x-k8s.kind.cluster=${{ inputs.cluster_name || 'daq-k8s-cluster' }}" --format '{{.Names}}' | head -n 1)

          echo "==================== CONTAINERS LOGS FROM KIND DISK ===================="
          docker exec "$KIND_NODE" bash -c '
            find /var/log/pods -name "*.log" -exec echo "=== Log file: {} ===" \; -exec cat {} \;
          '

      - name: Debug Kubernetes Pod State
        if: failure()
        run: |
          echo "=== All Pods across namespaces ==="
          kubectl get pods -A -o wide

          echo "=== Describe Failed Pods ==="
          kubectl describe pods -n smallfootprint || true

          echo "=== Pod Logs (if any container started) ==="
          kubectl logs -n smallfootprint -l app=root-controller --all-containers=true || true

      - name: Inspect Kubernetes Pod State & Failure
        if: failure()
        run: |
          KIND_NODE=$(docker ps --filter "label=io.x-k8s.kind.cluster=${{ inputs.cluster_name || 'daq-k8s-cluster' }}" --format '{{.Names}}' | head -n 1)

          echo "==================== ALL CONTAINERS (INCLUDING EXITED) ===================="
          docker exec "$KIND_NODE" crictl ps -a

          echo "==================== LOGS OF EXITED CONTAINERS ===================="
          docker exec "$KIND_NODE" bash -c '
            for cid in $(crictl ps -a --state Exited -q); do
              echo "--------------------------------------------------"
              echo "Container ID: $cid"
              crictl inspect "$cid" | grep -E "image|name|exitCode|reason" | head -n 10
              echo "--- STDOUT / STDERR ---"
              crictl logs "$cid"
              echo "--------------------------------------------------"
            done
          '
      - name: Inspect Kubernetes Pod State & Failure Count 12345
        if: failure()
        run: |
          echo "==================== DRUNC POD COMMAND DEFINITION ===================="
          # This prints the exact command and arguments Drunc configured for root-controller
          cat /__w/_temp/my_integration_test/pytest-of-root/pytest-0/config0/integtest-session-resolved.data.xml | grep -C 10 -i "root-controller" || true

          echo "==================== EXECUTABLE PERMISSIONS CHECK ===================="
          # This verifies if the virtual environment binaries actually have the +x bit
          NIGHTLY_CONTAINER_PATH=$(find /__w -maxdepth 4 -type d -name "NFD_DEV*" | head -n 1)
          ls -la "$NIGHTLY_CONTAINER_PATH"/.venv/bin/drunc-controller || true
          ls -la "$NIGHTLY_CONTAINER_PATH"/.venv/bin/drunc || true
