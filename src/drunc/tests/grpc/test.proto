syntax = "proto3";
package drunc.tests.grpc_tree;

// Service for Manager component
service ManagerService {
    // Basic method for connectivity testing
    rpc MakeRequest(DummyRequest) returns (DummyResponse);
    
    // Method for receiving updates from RootController
    rpc ReceiveUpdate(UpdateRequest) returns (UpdateResponse);
    
    // boot other processes via the manager
    rpc Boot(BootRequest) returns (BootResponse);

    // Method for graceful shutdown of the Manager service
    rpc Kill(KillRequest) returns (KillResponse);
}

message BootRequest {
    // Unique identifier for this booted process
    string process_id = 1;
    
    // Type of server to boot
    string server_type = 2;
    
    // Server configuration
    int32 port = 3;
    int32 max_workers = 4;
    string log_file = 5;
    
    // SSH connection details
    string env_setup_script = 6;
    string host = 7;
    string user = 8;
    
    // Optional server-specific parameters
    map<string, string> extra_params = 9;
}

message BootResponse {
    // Indicates if the boot request was successful
    bool success = 1;
    
    // Process ID of the booted server
    string process_id = 2;
    
    // Message describing the boot status or error
    string message = 3;
    
    // Port the server is running on
    int32 port = 4;
}

// Service for RootController component  
service RootControllerService {
    // Basic method for connectivity testing
    rpc MakeRequest(DummyRequest) returns (DummyResponse);
    
    // Method for receiving commands from Manager
    rpc ReceiveCommand(CommandRequest) returns (CommandResponse);
    
    // Method for receiving status from ChildControllers
    rpc ReceiveStatus(StatusRequest) returns (StatusResponse);
    
    // Method for graceful shutdown of the RootController service
    rpc Kill(KillRequest) returns (KillResponse);
}

// Service for ChildController components
service ChildControllerService {
    // Basic method for connectivity testing
    rpc MakeRequest(DummyRequest) returns (DummyResponse);
    
    // Method for receiving instructions from RootController
    rpc ReceiveInstruction(InstructionRequest) returns (InstructionResponse);
    
    // Method for graceful shutdown of the ChildController service
    rpc Kill(KillRequest) returns (KillResponse);
}

// Basic request/response for keepalive testing
message DummyRequest {
    string message = 1;
    int64 timestamp = 2;
}

message DummyResponse {
    string reply = 1;
    int64 timestamp = 2;
}

// Manager-RootController communication messages
message UpdateRequest {
    string update_type = 1;
    string content = 2;
    int64 sequence_number = 3;
}

message UpdateResponse {
    bool acknowledged = 1;
    string response_message = 2;
}

message CommandRequest {
    string command_type = 1;
    string parameters = 2;
    int64 command_id = 3;
}

message CommandResponse {
    bool success = 1;
    string result = 2;
    string error_message = 3;
}

// RootController-ChildController communication messages
message StatusRequest {
    string controller_id = 1;
    string status = 2;
    map<string, string> metrics = 3;
}

message StatusResponse {
    bool received = 1;
    string acknowledgement = 2;
}

message InstructionRequest {
    string instruction_type = 1;
    string payload = 2;
    int32 priority = 3;
}

message InstructionResponse {
    bool understood = 1;
    string execution_status = 2;
    int64 estimated_completion_time = 3;
}

// Shutdown/kill functionality messages
message KillRequest {
    // Reason for shutdown (for logging purposes)
    string reason = 1;
    // Grace period in seconds before force shutdown
    int32 grace_period_seconds = 2;
}

message KillResponse {
    // Indicates if the shutdown request was accepted
    bool shutdown_initiated = 1;
    // Message describing the shutdown status
    string message = 2;
}